<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg:#05060a; --violet:#8b5cf6; --cyan:#22d3ee; --pink:#ec4899;
    --text:#f4f6fb; --muted:#9aa3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    background:var(--bg);
    font-family:'Space Grotesk','Outfit',sans-serif;
    color:var(--text);
    position:relative;
  }
  /* grid */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(139,92,246,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,.07) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 42%, black 32%, transparent 80%);
            mask-image:radial-gradient(ellipse at 50% 42%, black 32%, transparent 80%);
  }
  /* orbs */
  .orb{ position:absolute; border-radius:50%; filter:blur(90px); }
  .orb-v{ width:460px;height:460px; left:-140px; top:-160px; background:radial-gradient(circle, rgba(139,92,246,.5), transparent 70%); }
  .orb-c{ width:520px;height:520px; right:-160px; bottom:-220px; background:radial-gradient(circle, rgba(34,211,238,.42), transparent 70%); }
  .orb-p{ width:300px;height:300px; left:56%; top:38%; background:radial-gradient(circle, rgba(236,72,153,.20), transparent 70%); }
  /* scanline sweep */
  .scan{
    position:absolute; left:0; right:0; height:120px; top:40%;
    background:linear-gradient(180deg, transparent, rgba(34,211,238,.06), transparent);
    animation:sweep 9s linear infinite;
  }
  @keyframes sweep { from{ transform:translateY(-140px);} to{ transform:translateY(240px);} }

  /* corner tags — visible only on the wide (projects-grid) crop */
  .tag{ position:absolute; font-family:'JetBrains Mono',monospace; font-size:15px; letter-spacing:.14em; color:var(--muted); }
  .tag a{ text-decoration:none; color:var(--muted); }
  .tl{ top:26px; left:30px; }
  .tl::before{ content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 10px var(--cyan); margin-right:9px; vertical-align:1px; }
  .br{ bottom:26px; right:30px; color:#6b7a93; }
  .br b{ color:var(--cyan); font-weight:700; }

  /* center composition — survives the 190px card crop */
  .center{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:640px; text-align:center; z-index:3;
  }
  .wordmark{
    font-size:74px; font-weight:700; letter-spacing:.06em; line-height:1;
    background:linear-gradient(115deg, var(--violet) 5%, var(--cyan) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 24px rgba(139,92,246,.45));
  }
  .sub{
    margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:19px;
    letter-spacing:.3em; color:#c7cde0; text-transform:uppercase;
  }
  .chain{
    margin-top:20px; display:flex; justify-content:center; align-items:center;
    gap:0; font-family:'JetBrains Mono',monospace; font-size:16px;
  }
  .pill{
    padding:7px 16px; border-radius:999px; color:#e6e9f5;
    background:rgba(139,92,246,.12); border:1px solid rgba(139,92,246,.45);
    box-shadow:0 0 16px rgba(139,92,246,.25) inset;
  }
  .pill.ok{ background:rgba(34,211,238,.10); border-color:rgba(34,211,238,.5); color:#d9fbff;
    box-shadow:0 0 16px rgba(34,211,238,.25) inset; }
  .arr{ color:#7b86a0; font-size:15px; margin:0 12px; }
  .endline{ margin-top:26px; font-family:'JetBrains Mono',monospace; font-size:14px; letter-spacing:.12em; color:#6b7a93; }
  .endline b{ color:var(--violet); }
  .endline .u{ color:var(--cyan); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb orb-v"></div>
  <div class="orb orb-c"></div>
  <div class="orb orb-p"></div>
  <div class="scan"></div>

  <div class="tag tl"><a href="https://alethean.org">alethean.org</a></div>
  <div class="tag br">AETHER RESEARCH ENGINE &middot; <b>LIVE</b></div>

  <div class="center">
    <svg width="150" height="150" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="core" cx="50%" cy="45%" r="70%">
          <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/>
        </radialGradient>
        <radialGradient id="cyg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0891b2"/>
        </radialGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- rings -->
      <ellipse cx="100" cy="100" rx="86" ry="34" fill="none" stroke="rgba(139,92,246,.25)" stroke-width="1.2" transform="rotate(-16 100 100)"/>
      <ellipse cx="100" cy="100" rx="58" ry="22" fill="none" stroke="rgba(34,211,238,.22)" stroke-width="1.2" transform="rotate(52 100 100)"/>
      <!-- connections -->
      <g stroke="rgba(167,139,250,.5)" stroke-width="1.6" filter="url(#glow)">
        <line x1="100" y1="100" x2="100" y2="34"/><line x1="100" y1="100" x2="166" y2="72"/>
        <line x1="100" y1="100" x2="186" y2="136"/><line x1="100" y1="100" x2="140" y2="180"/>
        <line x1="100" y1="100" x2="60" y2="180"/><line x1="100" y1="100" x2="14" y2="136"/>
        <line x1="100" y1="100" x2="34" y2="72"/>
      </g>
      <!-- orbital knowledge nodes -->
      <g filter="url(#glow)">
        <circle cx="100" cy="34"  r="7" fill="url(#cyg)"/>
        <circle cx="166" cy="72"  r="5" fill="url(#cyg)" opacity=".9"/>
        <circle cx="186" cy="136" r="6" fill="#a78bfa"/>
        <circle cx="140" cy="180" r="5" fill="#c4b5fd" opacity=".85"/>
        <circle cx="60"  cy="180" r="5" fill="url(#cyg)" opacity=".85"/>
        <circle cx="14"  cy="136" r="6" fill="#a78bfa"/>
        <circle cx="34"  cy="72"  r="5" fill="#c4b5fd" opacity=".9"/>
        <circle cx="120" cy="70"  r="3" fill="#ec4899" opacity=".9"/>
      </g>
      <!-- central core -->
      <polygon points="100,74 122,86 122,114 100,126 78,114 78,86" fill="url(#core)" stroke="rgba(255,255,255,.75)" stroke-width="2" filter="url(#glow)"/>
      <text x="100" y="106" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="26" font-weight="700" fill="#05060a">A</text>
    </svg>

    <div class="wordmark">ALETHEAN</div>
    <div class="sub">Autonomous Logic Engine &middot; Lean 4</div>

    <div class="chain">
      <span class="pill">conjecture</span><span class="arr">&#10142;</span>
      <span class="pill">formalize</span><span class="arr">&#10142;</span>
      <span class="pill ok">machine-checked proof &#10003;</span>
    </div>
    <div class="endline">hunt &middot; formalize &middot; <b>prove</b> &nbsp;&#8212;&nbsp; 5,052+ theorems <span class="u">zero sorrys</span></div>
  </div>
</body>
</html>
