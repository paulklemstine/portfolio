<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg:#05060a; --violet:#8b5cf6; --cyan:#22d3ee; --pink:#ec4899;
    --text:#f4f6fb; --muted:#9aa3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    background:var(--bg);
    font-family:'Space Grotesk','Outfit',sans-serif;
    color:var(--text);
    position:relative;
  }
  /* grid */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(139,92,246,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,.07) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 42%, black 32%, transparent 80%);
            mask-image:radial-gradient(ellipse at 50% 42%, black 32%, transparent 80%);
  }
  /* orbs */
  .orb{ position:absolute; border-radius:50%; filter:blur(90px); }
  .orb-v{ width:460px;height:460px; left:-140px; top:-160px; background:radial-gradient(circle, rgba(139,92,246,.5), transparent 70%); }
  .orb-p{ width:460px;height:460px; right:-140px; bottom:-200px; background:radial-gradient(circle, rgba(236,72,153,.42), transparent 70%); }
  .orb-c{ width:300px;height:300px; left:56%; top:38%; background:radial-gradient(circle, rgba(34,211,238,.20), transparent 70%); }

  /* corner tags — visible only on the wide (projects-grid) crop */
  .tag{ position:absolute; font-family:'JetBrains Mono',monospace; font-size:15px; letter-spacing:.14em; color:var(--muted); }
  .tag a{ text-decoration:none; color:var(--muted); }
  .tl{ top:26px; left:30px; }
  .tl::before{ content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--violet); box-shadow:0 0 10px var(--violet); margin-right:9px; vertical-align:1px; }
  .br{ bottom:26px; right:30px; color:#6b7a93; }
  .br b{ color:var(--pink); font-weight:700; }

  /* center composition — survives the 190px card crop */
  .center{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:660px; text-align:center; z-index:3;
  }
  .wordmark{
    font-size:76px; font-weight:700; letter-spacing:.08em; line-height:1;
    background:linear-gradient(115deg, var(--violet) 0%, var(--pink) 48%, var(--cyan) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 24px rgba(236,72,153,.45));
  }
  .sub{
    margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:18px;
    letter-spacing:.26em; color:#c7cde0; text-transform:uppercase;
  }
  .chain{
    margin-top:20px; display:flex; justify-content:center; align-items:center;
    gap:0; font-family:'JetBrains Mono',monospace; font-size:16px;
  }
  .pill{
    padding:7px 16px; border-radius:999px; color:#e6e9f5;
    background:rgba(139,92,246,.12); border:1px solid rgba(139,92,246,.45);
    box-shadow:0 0 16px rgba(139,92,246,.25) inset;
  }
  .pill.ok{ background:rgba(34,211,238,.10); border-color:rgba(34,211,238,.5); color:#d9fbff;
    box-shadow:0 0 16px rgba(34,211,238,.25) inset; }
  .arr{ color:#7b86a0; font-size:15px; margin:0 12px; }
  .endline{ margin-top:26px; font-family:'JetBrains Mono',monospace; font-size:14px; letter-spacing:.12em; color:#6b7a93; }
  .endline b{ color:var(--pink); }
  .endline .u{ color:var(--cyan); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb orb-v"></div>
  <div class="orb orb-p"></div>
  <div class="orb orb-c"></div>

  <div class="tag tl"><a href="https://pythagoreancosmos.web.app">pythagoreancosmos.web.app</a></div>
  <div class="tag br">FORMAL PROOF ENGINE &middot; <b>VERIFIED</b></div>

  <div class="center">
    <svg width="160" height="160" viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- cosmic ring -->
      <circle cx="100" cy="95" r="80" fill="none" stroke="rgba(139,92,246,.22)" stroke-width="1.2" stroke-dasharray="4 7"/>
      <!-- Pythagorean geometry: a² + b² = c² -->
      <g transform="translate(0,-20)">
        <!-- b² square (leg b, left) -->
        <rect x="25" y="90" width="50" height="50" fill="rgba(139,92,246,.10)" stroke="#a78bfa" stroke-width="1.6"/>
        <!-- a² square (leg a, below) -->
        <rect x="75" y="140" width="50" height="50" fill="rgba(34,211,238,.10)" stroke="#67e8f9" stroke-width="1.6"/>
        <!-- c² square (hypotenuse, up-right) -->
        <polygon points="125,140 75,90 125,40 175,90" fill="rgba(236,72,153,.10)" stroke="#f472b6" stroke-width="1.6"/>
        <!-- right triangle -->
        <polygon points="75,90 75,140 125,140" fill="url(#tri)" stroke="#f4f6fb" stroke-width="2" filter="url(#glow)"/>
        <!-- right-angle marker -->
        <path d="M 75 128 L 87 128 L 87 140" fill="none" stroke="#f4f6fb" stroke-width="1.5" opacity=".85"/>
        <!-- labels -->
        <text x="50" y="118" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="15" fill="#c4b5fd">b&#178;</text>
        <text x="100" y="168" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="15" fill="#a5f3fc">a&#178;</text>
        <text x="125" y="93" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="15" fill="#f9a8d4">c&#178;</text>
      </g>
      <!-- orbiting nodes -->
      <g filter="url(#glow)">
        <circle cx="180" cy="60" r="4" fill="#22d3ee"/>
        <circle cx="158" cy="164" r="3.5" fill="#8b5cf6"/>
        <circle cx="40" cy="140" r="4" fill="#ec4899"/>
        <circle cx="30" cy="40" r="3" fill="#a78bfa"/>
        <circle cx="140" cy="20" r="3" fill="#67e8f9" opacity=".9"/>
        <circle cx="70" cy="172" r="3" fill="#f472b6" opacity=".85"/>
      </g>
    </svg>

    <div class="wordmark">COSMOS</div>
    <div class="sub">Formally Verified Unifying Theory</div>

    <div class="chain">
      <span class="pill">a&sup2; + b&sup2; = c&sup2;</span><span class="arr">&#10142;</span>
      <span class="pill">5,052+ theorems</span><span class="arr">&#10142;</span>
      <span class="pill ok">machine-verified &#10003;</span>
    </div>
    <div class="endline">number theory &middot; quantum &middot; neural &middot; <b>relativity</b> &nbsp;&#8212;&nbsp; <span class="u">one equation</span></div>
  </div>
</body>
</html>
