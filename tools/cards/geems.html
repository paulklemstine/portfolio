<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg:#05060a; --violet:#8b5cf6; --cyan:#22d3ee; --pink:#ec4899;
    --text:#f4f6fb; --muted:#9aa3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    background:var(--bg);
    font-family:'Space Grotesk','Outfit',sans-serif;
    color:var(--text);
    position:relative;
  }
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(236,72,153,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(236,72,153,.07) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 42%, black 32%, transparent 80%);
            mask-image:radial-gradient(ellipse at 50% 42%, black 32%, transparent 80%);
  }
  .orb{ position:absolute; border-radius:50%; filter:blur(90px); }
  .orb-p{ width:480px;height:480px; left:-150px; top:-160px; background:radial-gradient(circle, rgba(236,72,153,.5), transparent 70%); }
  .orb-v{ width:520px;height:520px; right:-160px; bottom:-220px; background:radial-gradient(circle, rgba(139,92,246,.45), transparent 70%); }
  .orb-c{ width:280px;height:280px; left:58%; top:36%; background:radial-gradient(circle, rgba(34,211,238,.18), transparent 70%); }

  .tag{ position:absolute; font-family:'JetBrains Mono',monospace; font-size:15px; letter-spacing:.14em; color:var(--muted); }
  .tag a{ text-decoration:none; color:var(--muted); }
  .tl{ top:26px; left:30px; }
  .tl::before{ content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--pink); box-shadow:0 0 10px var(--pink); margin-right:9px; vertical-align:1px; }
  .br{ bottom:26px; right:30px; color:#6b7a93; }
  .br b{ color:var(--pink); font-weight:700; }

  .center{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:660px; text-align:center; z-index:3;
  }
  .wordmark{
    font-size:76px; font-weight:700; letter-spacing:.05em; line-height:1;
    background:linear-gradient(115deg, var(--violet) 5%, var(--pink) 92%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 24px rgba(236,72,153,.4));
  }
  .sub{
    margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:18px;
    letter-spacing:.26em; color:#c7cde0; text-transform:uppercase;
  }
  .chain{
    margin-top:20px; display:flex; justify-content:center; align-items:center;
    gap:0; font-family:'JetBrains Mono',monospace; font-size:16px;
  }
  .pill{
    padding:7px 16px; border-radius:999px; color:#e6e9f5;
    background:rgba(236,72,153,.12); border:1px solid rgba(236,72,153,.5);
    box-shadow:0 0 16px rgba(236,72,153,.22) inset;
  }
  .pill.ai{ background:rgba(139,92,246,.12); border-color:rgba(139,92,246,.55); box-shadow:0 0 16px rgba(139,92,246,.25) inset; }
  .arr{ color:#7b86a0; font-size:15px; margin:0 12px; }
  .endline{ margin-top:26px; font-family:'JetBrains Mono',monospace; font-size:14px; letter-spacing:.12em; color:#6b7a93; }
  .endline b{ color:var(--pink); }
  .endline .u{ color:var(--violet); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb orb-p"></div>
  <div class="orb orb-v"></div>
  <div class="orb orb-c"></div>

  <div class="tag tl"><a href="https://geems.web.app">geems.web.app</a></div>
  <div class="tag br">AI PSYCHOLOGY ENGINE &middot; <b>READING YOU</b></div>

  <div class="center">
    <svg width="160" height="150" viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f9a8d4"/><stop offset="55%" stop-color="#ec4899"/><stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <radialGradient id="core" cx="50%" cy="42%" r="70%">
          <stop offset="0%" stop-color="#fbcfe8"/><stop offset="100%" stop-color="#ec4899"/>
        </radialGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- radar arc -->
      <path d="M 28 78 A 78 78 0 0 1 172 78" fill="none" stroke="rgba(236,72,153,.35)" stroke-width="1.4" stroke-dasharray="4 6"/>
      <!-- story branches: choices converge on the gem -->
      <g stroke="rgba(167,139,250,.6)" stroke-width="1.6" fill="none" filter="url(#glow)">
        <path d="M 24 150 C 44 130, 66 132, 88 138"/>
        <path d="M 176 150 C 156 130, 134 132, 112 138"/>
      </g>
      <g filter="url(#glow)">
        <rect x="8"  y="146" width="26" height="26" rx="6" fill="rgba(139,92,246,.22)" stroke="#a78bfa" stroke-width="1.6"/>
        <rect x="166" y="146" width="26" height="26" rx="6" fill="rgba(139,92,246,.22)" stroke="#a78bfa" stroke-width="1.6"/>
        <text x="21"  y="164" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="14" fill="#e9d5ff">A</text>
        <text x="179" y="164" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="14" fill="#e9d5ff">B</text>
        <circle cx="100" cy="132" r="4" fill="#ec4899"/>
        <circle cx="92"  cy="136" r="3" fill="#ec4899" opacity=".7"/>
        <circle cx="108" cy="136" r="3" fill="#ec4899" opacity=".7"/>
      </g>
      <!-- gem -->
      <g filter="url(#glow)">
        <polygon points="100,18 138,48 158,92 100,168 42,92 62,48" fill="url(#gem)" stroke="#f9a8d4" stroke-width="2"/>
        <polygon points="100,18 100,96 138,48" fill="url(#core)" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
        <polygon points="100,18 100,96 62,48" fill="rgba(255,255,255,.18)"/>
        <polygon points="100,96 158,92 138,48" fill="rgba(124,58,237,.35)"/>
        <polygon points="100,96 42,92 62,48" fill="rgba(124,58,237,.35)"/>
        <polygon points="100,96 158,92 100,168" fill="rgba(124,58,237,.55)"/>
        <polygon points="100,96 42,92 100,168" fill="rgba(190,24,93,.45)"/>
        <circle cx="84" cy="70" r="5" fill="rgba(255,255,255,.75)"/>
      </g>
    </svg>

    <div class="wordmark">GEEMS</div>
    <div class="sub">Guided Extreme Emotional Mental States</div>

    <div class="chain">
      <span class="pill">your choices</span><span class="arr">&#10142;</span>
      <span class="pill ai">AI psychologist reads you</span><span class="arr">&#10142;</span>
      <span class="pill">wellness + personality report</span>
    </div>
    <div class="endline">a story that <b>reads you</b> &nbsp;&#8212;&nbsp; <span class="u">choose your own adventure</span></div>
  </div>
</body>
</html>
