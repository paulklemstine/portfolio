<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg:#05060a; --violet:#8b5cf6; --cyan:#22d3ee; --pink:#ec4899;
    --text:#f4f6fb; --muted:#9aa3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    background:var(--bg);
    font-family:'Space Grotesk','Outfit',sans-serif;
    color:var(--text);
    position:relative;
  }
  /* grid */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(34,211,238,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.07) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 42%, black 32%, transparent 80%);
            mask-image:radial-gradient(ellipse at 50% 42%, black 32%, transparent 80%);
  }
  /* orbs */
  .orb{ position:absolute; border-radius:50%; filter:blur(90px); }
  .orb-c{ width:480px;height:480px; left:-150px; top:-160px; background:radial-gradient(circle, rgba(34,211,238,.5), transparent 70%); }
  .orb-v{ width:520px;height:520px; right:-160px; bottom:-220px; background:radial-gradient(circle, rgba(139,92,246,.45), transparent 70%); }
  .orb-p{ width:280px;height:280px; left:58%; top:36%; background:radial-gradient(circle, rgba(236,72,153,.18), transparent 70%); }
  /* scanline sweep */
  .scan{
    position:absolute; left:0; right:0; height:120px; top:40%;
    background:linear-gradient(180deg, transparent, rgba(34,211,238,.06), transparent);
    animation:sweep 9s linear infinite;
  }
  @keyframes sweep { from{ transform:translateY(-140px);} to{ transform:translateY(240px);} }

  /* corner tags — visible only on the wide (projects-grid) crop */
  .tag{ position:absolute; font-family:'JetBrains Mono',monospace; font-size:15px; letter-spacing:.14em; color:var(--muted); }
  .tag a{ text-decoration:none; color:var(--muted); }
  .tl{ top:26px; left:30px; }
  .tl::before{ content:""; display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 10px var(--cyan); margin-right:9px; vertical-align:1px; }
  .br{ bottom:26px; right:30px; color:#6b7a93; }
  .br b{ color:var(--cyan); font-weight:700; }

  /* center composition — survives the 190px card crop */
  .center{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:660px; text-align:center; z-index:3;
  }
  .wordmark{
    font-size:76px; font-weight:700; letter-spacing:.05em; line-height:1;
    background:linear-gradient(115deg, var(--cyan) 5%, var(--violet) 92%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 24px rgba(34,211,238,.4));
  }
  .sub{
    margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:18px;
    letter-spacing:.26em; color:#c7cde0; text-transform:uppercase;
  }
  .chain{
    margin-top:20px; display:flex; justify-content:center; align-items:center;
    gap:0; font-family:'JetBrains Mono',monospace; font-size:16px;
  }
  .pill{
    padding:7px 16px; border-radius:999px; color:#e6e9f5;
    background:rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.5);
    box-shadow:0 0 16px rgba(34,211,238,.22) inset;
  }
  .pill.ok{ background:rgba(139,92,246,.12); border-color:rgba(139,92,246,.55); box-shadow:0 0 16px rgba(139,92,246,.25) inset; }
  .arr{ color:#7b86a0; font-size:15px; margin:0 12px; }
  .endline{ margin-top:26px; font-family:'JetBrains Mono',monospace; font-size:14px; letter-spacing:.12em; color:#6b7a93; }
  .endline b{ color:var(--cyan); }
  .endline .u{ color:var(--violet); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="orb orb-c"></div>
  <div class="orb orb-v"></div>
  <div class="orb orb-p"></div>
  <div class="scan"></div>

  <div class="tag tl"><a href="https://flowspace.web.app">flowspace.web.app</a></div>
  <div class="tag br">AI COLLAB WHITEBOARD &middot; <b>LIVE</b></div>

  <div class="center">
    <svg width="170" height="160" viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- whiteboard canvas -->
      <rect x="14" y="10" width="172" height="170" rx="12" fill="rgba(34,211,238,.03)" stroke="rgba(34,211,238,.20)" stroke-width="1.2"/>
      <!-- mind-map connectors -->
      <g stroke="rgba(103,232,249,.55)" stroke-width="1.6" fill="none" filter="url(#glow)">
        <path d="M 96 96 C 84 74, 66 56, 54 50"/>
        <path d="M 104 96 C 116 74, 134 56, 146 50"/>
        <path d="M 100 107 C 100 120, 102 130, 103 140"/>
      </g>
      <!-- leaf sticky notes -->
      <g filter="url(#glow)">
        <rect x="30" y="34" width="44" height="28" rx="5" fill="rgba(139,92,246,.22)" stroke="#a78bfa" stroke-width="1.5"/>
        <path d="M 66 34 L 74 34 L 74 42 Z" fill="#7c3aed"/>
        <rect x="126" y="34" width="44" height="28" rx="5" fill="rgba(139,92,246,.22)" stroke="#a78bfa" stroke-width="1.5"/>
        <path d="M 162 34 L 170 34 L 170 42 Z" fill="#7c3aed"/>
        <rect x="84" y="134" width="40" height="28" rx="5" fill="rgba(236,72,153,.20)" stroke="#f472b6" stroke-width="1.5"/>
        <path d="M 116 134 L 124 134 L 124 142 Z" fill="#be185d"/>
      </g>
      <!-- center node -->
      <rect x="82" y="80" width="36" height="30" rx="6" fill="rgba(34,211,238,.25)" stroke="#67e8f9" stroke-width="1.8" filter="url(#glow)"/>
      <path d="M 110 80 L 118 80 L 118 88 Z" fill="#0891b2" filter="url(#glow)"/>
      <circle cx="100" cy="95" r="4.5" fill="#05060a"/>
      <!-- collab cursors -->
      <g filter="url(#glow)">
        <path transform="translate(146,44)" d="M0 0 L16 14 L3 12 Z" fill="#67e8f9"/>
        <path transform="translate(130,158) rotate(-30)" d="M0 0 L16 14 L3 12 Z" fill="#f472b6"/>
      </g>
      <!-- AI spark -->
      <g transform="translate(24,14)" filter="url(#glow)">
        <path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="#a5f3fc"/>
      </g>
    </svg>

    <div class="wordmark">FLOW SPACE</div>
    <div class="sub">Real-Time Collaborative &middot; AI Generation</div>

    <div class="chain">
      <span class="pill">your ideas</span><span class="arr">&#10142;</span>
      <span class="pill">AI content generation</span><span class="arr">&#10142;</span>
      <span class="pill ok">live collab &#10003;</span>
    </div>
    <div class="endline">sticky notes &middot; flowcharts &middot; mind maps &nbsp;&#8212;&nbsp; <b>build together</b> <span class="u">in real time</span></div>
  </div>
</body>
</html>
